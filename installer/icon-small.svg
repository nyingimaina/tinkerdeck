<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Lite Commander (small sizes)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26357a"/>
      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <!-- three status dots: the group of terminals -->
  <circle cx="150" cy="120" r="30" fill="#34d399"/>
  <circle cx="256" cy="120" r="30" fill="#34d399"/>
  <circle cx="362" cy="120" r="30" fill="#fbbf24"/>
  <!-- bold prompt and cursor -->
  <polyline points="120,220 250,320 120,420" fill="none" stroke="url(#accent)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="378" width="120" height="52" rx="18" fill="url(#accent)"/>
</svg>

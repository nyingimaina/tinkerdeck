[package]
name = "tinkerdeck"
version = "2.4.1"
description = "Tinkerdeck, a tinkerer's deck: group a project's terminals into apps, start and stop them reliably, with git, an editor and an MCP server."
edition = "2021"
default-run = "tinkerdeck"

[[bin]]
name = "tinkerdeck"
path = "src/main.rs"

[[bin]]
name = "tdk"
path = "src/bin/tdk/main.rs"

[lib]
name = "tinkerdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
anyhow = "1"
ureq = "2"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
opt-level = "s"
strip = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Tinkerdeck</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d424c"/>
      <stop offset="0.55" stop-color="#1f2329"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#b98a0a"/>
    </linearGradient>
        <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="0.5" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#d8d1bc"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a31"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="116"/></clipPath>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="230" fill="url(#rim)" clip-path="url(#tile)"/>

  <!-- the deck: three cards fanned from one pivot -->
  <g filter="url(#lift)">
    <rect x="146" y="104" width="220" height="304" rx="32" fill="url(#rose)" transform="rotate(-21 256 430)"/>
  </g>
  <g filter="url(#lift)">
    <rect x="146" y="104" width="220" height="304" rx="32" fill="url(#bone)" transform="rotate(-9 256 430)"/>
  </g>
  <g filter="url(#lift)" transform="rotate(4 256 430)">
    <rect x="146" y="104" width="220" height="304" rx="32" fill="url(#face)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
    <!-- prompt: the card you work on -->
    <g filter="url(#glow)">
      <polyline points="190,214 252,262 190,310" fill="none" stroke="url(#glyph)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="268" y="300" width="64" height="22" rx="11" fill="url(#glyph)"/>
    </g>
    <circle cx="176" cy="146" r="7" fill="#f87171"/>
    <circle cx="198" cy="146" r="7" fill="#facc15"/>
    <circle cx="220" cy="146" r="7" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <!-- the tinkerer's cog -->
  <g transform="translate(376 386)" filter="url(#lift)">
    <circle r="66" fill="#0d0f12"/>
    <circle r="50" fill="none" stroke="url(#amber)" stroke-width="20" stroke-dasharray="24 15.3" stroke-dashoffset="12"/>
    <circle r="44" fill="url(#amber)"/>
    <circle r="18" fill="#0d0f12"/>
  </g>
</svg>

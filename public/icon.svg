<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Tinkerdeck (small sizes)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#434853"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#d8d1bc"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <!-- two cards behind, then the front card with a bold prompt -->
  <rect x="130" y="80" width="252" height="352" rx="40" fill="url(#amber)" transform="rotate(-22 256 440)"/>
  <rect x="130" y="80" width="252" height="352" rx="40" fill="url(#bone)" transform="rotate(-10 256 440)"/>
  <g transform="rotate(4 256 440)">
    <rect x="130" y="80" width="252" height="352" rx="40" fill="#14171c" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6"/>
    <polyline points="186,210 262,272 186,334" fill="none" stroke="url(#glyph)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="276" y="338" width="76" height="40" rx="16" fill="url(#glyph)"/>
  </g>
</svg>
